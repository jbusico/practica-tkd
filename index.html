<script>
const DATA={"topics":[{"id":"doctrinas","name":"Doctrinas y su explicación","sub":"Las 5 doctrinas del Taekwon-Do","dan":"II Dan","sections":[{"t":"Las 5 doctrinas del Taekwon-Do","items":[{"h":"1. Cortesía (Ye Ui)","t":"Regla dada por los antiguos maestros de filosofía como medio de elevación del ser humano. Se refleja en ser una persona educada, que respeta al otro, actúa con justicia, humanidad y sinceridad, y se avergüenza de los vicios propios y desprecia los ajenos."},{"h":"2. Integridad (Yom Chi)","t":"Saber distinguir lo correcto de lo incorrecto y, si algo está mal, tener conciencia de ello y sentir que no está bien.\nEjemplos de lo contrario: enseñar técnicas incorrectas, obtener rangos solo por poder o egocentrismo, enseñar solo con un propósito material, actuar diferente a las propias palabras."},{"h":"3. Perseverancia (In Nae)","t":"Antiguo dicho oriental: “La paciencia lleva a la virtud o al mérito”. Para lograr algo hay que intentarlo constantemente, sin desalentarse ni abandonar en los primeros intentos o cuando las cosas no salen tan bien.\n«Quien es impaciente en temas triviales fallará en sus logros en asuntos de mucha importancia.» — Confucio"},{"h":"4. Autocontrol (Guk Gi)","t":"Es importante en todas las situaciones de la vida, no solo en el Taekwon-Do. Perder el autocontrol en combate libre puede provocar un desastre, tanto en uno mismo como en el oponente.\n«La persona más fuerte es la que gana sobre sí mismo más que sobre cualquier otra.» — Lao-Tzu"},{"h":"5. Espíritu indomable (Baekjul Boolgool)","t":"Enfrentar un problema inmenso con valentía y sin renunciar a los principios. Ante una injusticia hay que actuar sin temor ni vacilación, sin tener en cuenta el número de personas a las que hay que enfrentar.\n«No protestar contra la injusticia es acto de cobardía.» — Confucio"}]}],"cards":[{"i":"doctrinas.1","q":"¿Cómo se llama en coreano la doctrina «Cortesía»?","a":"Ye Ui","p":"dok"},{"i":"doctrinas.2","q":"¿Qué doctrina se llama «Ye Ui»?","a":"Cortesía","p":"dname"},{"i":"doctrinas.3","q":"¿Qué doctrina es esta? «Regla dada por los antiguos maestros de filosofía como medio de elevación del ser humano. Se refleja en ser una persona educada, que respeta al otro, actúa con justicia, humanidad y sinceridad, y se avergüenza de los vicios propios y desprecia los ajenos.»","a":"Cortesía","p":"dname"},{"i":"doctrinas.4","q":"Explica la doctrina «Cortesía» (Ye Ui).","a":"Regla dada por los antiguos maestros de filosofía como medio de elevación del ser humano. Se refleja en ser una persona educada, que respeta al otro, actúa con justicia, humanidad y sinceridad, y se avergüenza de los vicios propios y desprecia los ajenos."},{"i":"doctrinas.5","q":"¿Cómo se llama en coreano la doctrina «Integridad»?","a":"Yom Chi","p":"dok"},{"i":"doctrinas.6","q":"¿Qué doctrina se llama «Yom Chi»?","a":"Integridad","p":"dname"},{"i":"doctrinas.7","q":"¿Qué doctrina es esta? «Saber distinguir lo correcto de lo incorrecto y, si algo está mal, tener conciencia de ello y sentir que no está bien.»","a":"Integridad","p":"dname"},{"i":"doctrinas.8","q":"Explica la doctrina «Integridad» (Yom Chi).","a":"Saber distinguir lo correcto de lo incorrecto y, si algo está mal, tener conciencia de ello y sentir que no está bien.\nEjemplos de lo contrario: enseñar técnicas incorrectas, obtener rangos solo por poder o egocentrismo, enseñar solo con un propósito material, actuar diferente a las propias palabras."},{"i":"doctrinas.9","q":"Doctrina «Integridad»: ¿qué conductas la contradicen?","a":"enseñar técnicas incorrectas, obtener rangos solo por poder o egocentrismo, enseñar solo con un propósito material, actuar diferente a las propias palabras."},{"i":"doctrinas.10","q":"¿Cómo se llama en coreano la doctrina «Perseverancia»?","a":"In Nae","p":"dok"},{"i":"doctrinas.11","q":"¿Qué doctrina se llama «In Nae»?","a":"Perseverancia","p":"dname"},{"i":"doctrinas.12","q":"¿Qué doctrina es esta? «Antiguo dicho oriental: “La paciencia lleva a la virtud o al mérito”. Para lograr algo hay que intentarlo constantemente, sin desalentarse ni abandonar en los primeros intentos o cuando las cosas no salen tan bien.»","a":"Perseverancia","p":"dname"},{"i":"doctrinas.13","q":"Explica la doctrina «Perseverancia» (In Nae).","a":"Antiguo dicho oriental: “La paciencia lleva a la virtud o al mérito”. Para lograr algo hay que intentarlo constantemente, sin desalentarse ni abandonar en los primeros intentos o cuando las cosas no salen tan bien.\n«Quien es impaciente en temas triviales fallará en sus logros en asuntos de mucha importancia.» — Confucio"},{"i":"doctrinas.14","q":"¿Quién dijo: «Quien es impaciente en temas triviales fallará en sus logros en asuntos de mucha importancia.»?","a":"Confucio","p":"who"},{"i":"doctrinas.15","q":"¿Cómo se llama en coreano la doctrina «Autocontrol»?","a":"Guk Gi","p":"dok"},{"i":"doctrinas.16","q":"¿Qué doctrina se llama «Guk Gi»?","a":"Autocontrol","p":"dname"},{"i":"doctrinas.17","q":"¿Qué doctrina es esta? «Es importante en todas las situaciones de la vida, no solo en el Taekwon-Do. Perder el autocontrol en combate libre puede provocar un desastre, tanto en uno mismo como en el oponente.»","a":"Autocontrol","p":"dname"},{"i":"doctrinas.18","q":"Explica la doctrina «Autocontrol» (Guk Gi).","a":"Es importante en todas las situaciones de la vida, no solo en el Taekwon-Do. Perder el autocontrol en combate libre puede provocar un desastre, tanto en uno mismo como en el oponente.\n«La persona más fuerte es la que gana sobre sí mismo más que sobre cualquier otra.» — Lao-Tzu"},{"i":"doctrinas.19","q":"¿Quién dijo: «La persona más fuerte es la que gana sobre sí mismo más que sobre cualquier otra.»?","a":"Lao-Tzu","p":"who"},{"i":"doctrinas.20","q":"¿Cómo se llama en coreano la doctrina «Espíritu indomable»?","a":"Baekjul Boolgool","p":"dok"},{"i":"doctrinas.21","q":"¿Qué doctrina se llama «Baekjul Boolgool»?","a":"Espíritu indomable","p":"dname"},{"i":"doctrinas.22","q":"¿Qué doctrina es esta? «Enfrentar un problema inmenso con valentía y sin renunciar a los principios. Ante una injusticia hay que actuar sin temor ni vacilación, sin tener en cuenta el número de personas a las que hay que enfrentar.»","a":"Espíritu indomable","p":"dname"},{"i":"doctrinas.23","q":"Explica la doctrina «Espíritu indomable» (Baekjul Boolgool).","a":"Enfrentar un problema inmenso con valentía y sin renunciar a los principios. Ante una injusticia hay que actuar sin temor ni vacilación, sin tener en cuenta el número de personas a las que hay que enfrentar.\n«No protestar contra la injusticia es acto de cobardía.» — Confucio"},{"i":"doctrinas.24","q":"¿Quién dijo: «No protestar contra la injusticia es acto de cobardía.»?","a":"Confucio","p":"who"},{"i":"doctrinas.25","q":"Nombra las 5 doctrinas con su nombre coreano.","a":"Cortesía (Ye Ui) · Integridad (Yom Chi) · Perseverancia (In Nae) · Autocontrol (Guk Gi) · Espíritu indomable (Baekjul Boolgool)"}],"readMin":5,"words":266},{"id":"instructor","name":"El instructor ideal y sus deberes","sub":"8 cualidades · 12 deberes","dan":"II Dan","sections":[{"t":"Las 8 cualidades del instructor ideal","items":[{"h":"1.","t":"Moral sólida y ética."},{"h":"2.","t":"Visión clara y filosofía de vida."},{"h":"3.","t":"Actitud responsable como instructor."},{"h":"4.","t":"Mente científica en asuntos técnicos."},{"h":"5.","t":"Conocimiento de los puntos vitales."},{"h":"6.","t":"Integridad inquebrantable (política y financiera)."},{"h":"7.","t":"Dedicación a la propagación del Taekwon-Do por el mundo."},{"h":"8.","t":"Quien tiene la confianza de sus superiores, sus compañeros le tendrán confianza y recibirá el respeto de sus alumnos."}]},{"t":"Los 12 deberes del instructor","items":[{"h":"1. Nunca te canses de enseñar.","t":"Un buen instructor puede enseñar en cualquier momento y lugar, y siempre está listo para responder preguntas."},{"h":"2. Desear que los alumnos lo sobrepasen:","t":"es su máxima aspiración. Si un alumno se desarrolló más allá de sus capacidades, debe enviarlo con un instructor de rango superior o más capacitado. Nunca retenerlo."},{"h":"3. Ser un buen ejemplo.","t":"Nunca defraudar a los estudiantes."},{"h":"4. El desarrollo del alumno está por encima de lo comercial.","t":"Si se preocupa por el material, perderá el respeto de sus estudiantes."},{"h":"5. Enseñar científica y teóricamente","t":"para ahorrar tiempo y energía."},{"h":"6. Preocuparse por sus alumnos","t":"tanto en el dojang como fuera de él."},{"h":"7. Alentar a visitar otros dojang","t":"y a estudiar otras técnicas: sirven las útiles y permiten comparar con las de inferior nivel."},{"h":"8. Tratar a todos igual, sin favoritos.","t":"Los estudiantes se regañan en privado, nunca frente a la clase."},{"h":"9. Si no sabe responder, no inventar:","t":"admitir su ignorancia y buscar la respuesta lo más pronto posible."},{"h":"10. No pedir favores especiales","t":"a sus alumnos."},{"h":"11. No buscar hazañas en sus estudiantes:","t":"el único propósito es producir su excelencia técnica y mental."},{"h":"12. Ser siempre honesto","t":"con los estudiantes y nunca quebrar su confianza."}]}],"cards":[{"i":"instructor.1","q":"Instructor ideal: ¿cuál es la cualidad nº 1?","a":"Moral sólida y ética."},{"i":"instructor.2","q":"Instructor ideal: ¿cuál es la cualidad nº 2?","a":"Visión clara y filosofía de vida."},{"i":"instructor.3","q":"Instructor ideal: ¿cuál es la cualidad nº 3?","a":"Actitud responsable como instructor."},{"i":"instructor.4","q":"Instructor ideal: ¿cuál es la cualidad nº 4?","a":"Mente científica en asuntos técnicos."},{"i":"instructor.5","q":"Instructor ideal: ¿cuál es la cualidad nº 5?","a":"Conocimiento de los puntos vitales."},{"i":"instructor.6","q":"Instructor ideal: ¿cuál es la cualidad nº 6?","a":"Integridad inquebrantable (política y financiera)."},{"i":"instructor.7","q":"Instructor ideal: ¿cuál es la cualidad nº 7?","a":"Dedicación a la propagación del Taekwon-Do por el mundo."},{"i":"instructor.8","q":"Instructor ideal: ¿cuál es la cualidad nº 8?","a":"Quien tiene la confianza de sus superiores, sus compañeros le tendrán confianza y recibirá el respeto de sus alumnos."},{"i":"instructor.9","q":"Enumera las 8 cualidades del instructor ideal.","a":"1. Moral sólida y ética.\n2. Visión clara y filosofía de vida.\n3. Actitud responsable como instructor.\n4. Mente científica en asuntos técnicos.\n5. Conocimiento de los puntos vitales.\n6. Integridad inquebrantable (política y financiera).\n7. Dedicación a la propagación del Taekwon-Do por el mundo.\n8. Quien tiene la confianza de sus superiores, sus compañeros le tendrán confianza y recibirá el respeto de sus alumnos."},{"i":"instructor.10","q":"Deber del instructor: «Nunca te canses de enseñar.» ¿qué significa?","a":"Un buen instructor puede enseñar en cualquier momento y lugar, y siempre está listo para responder preguntas."},{"i":"instructor.11","q":"Deber del instructor: «Desear que los alumnos lo sobrepasen:» ¿qué significa?","a":"es su máxima aspiración. Si un alumno se desarrolló más allá de sus capacidades, debe enviarlo con un instructor de rango superior o más capacitado. Nunca retenerlo."},{"i":"instructor.12","q":"Deber del instructor: «Ser un buen ejemplo.» ¿qué significa?","a":"Nunca defraudar a los estudiantes."},{"i":"instructor.13","q":"Deber del instructor: «El desarrollo del alumno está por encima de lo comercial.» ¿qué significa?","a":"Si se preocupa por el material, perderá el respeto de sus estudiantes."},{"i":"instructor.14","q":"Deber del instructor: «Enseñar científica y teóricamente» ¿qué significa?","a":"para ahorrar tiempo y energía."},{"i":"instructor.15","q":"Deber del instructor: «Preocuparse por sus alumnos» ¿qué significa?","a":"tanto en el dojang como fuera de él."},{"i":"instructor.16","q":"Deber del instructor: «Alentar a visitar otros dojang» ¿qué significa?","a":"y a estudiar otras técnicas: sirven las útiles y permiten comparar con las de inferior nivel."},{"i":"instructor.17","q":"Deber del instructor: «Tratar a todos igual, sin favoritos.» ¿qué significa?","a":"Los estudiantes se regañan en privado, nunca frente a la clase."},{"i":"instructor.18","q":"Deber del instructor: «Si no sabe responder, no inventar:» ¿qué significa?","a":"admitir su ignorancia y buscar la respuesta lo más pronto posible."},{"i":"instructor.19","q":"Deber del instructor: «No pedir favores especiales» ¿qué significa?","a":"a sus alumnos."},{"i":"instructor.20","q":"Deber del instructor: «No buscar hazañas en sus estudiantes:» ¿qué significa?","a":"el único propósito es producir su excelencia técnica y mental."},{"i":"instructor.21","q":"Deber del instructor: «Ser siempre honesto» ¿qué significa?","a":"con los estudiantes y nunca quebrar su confianza."},{"i":"instructor.22","q":"Enumera los 12 deberes del instructor (títulos).","a":"1. Nunca te canses de enseñar.\n2. Desear que los alumnos lo sobrepasen:\n3. Ser un buen ejemplo.\n4. El desarrollo del alumno está por encima de lo comercial.\n5. Enseñar científica y teóricamente\n6. Preocuparse por sus alumnos\n7. Alentar a visitar otros dojang\n8. Tratar a todos igual, sin favoritos.\n9. Si no sabe responder, no inventar:\n10. No pedir favores especiales\n11. No buscar hazañas en sus estudiantes:\n12. Ser siempre honesto"}],"readMin":5,"words":284},{"id":"poder","name":"Teoría del poder","sub":"Los 5 factores y las fórmulas","dan":"II Dan","sections":[{"t":"Los 5 factores del poder","items":[{"h":"1. Fuerza de reacción (Bandong Ryok)","t":"Ley de Newton: toda fuerza genera una fuerza igual y en sentido opuesto. Si un auto choca contra una pared con 1000 kg, la pared le devuelve 1000 kg.\n• Del oponente: si a quien ataca velozmente se le aplica un suave golpe, la fuerza será la de su ataque más la del golpe aplicado.\n• Propia: un golpe con la mano derecha se ayuda llevando el puño izquierdo hacia atrás."},{"h":"2. Concentración (Jip Joong)","t":"Aplicar la fuerza de impacto sobre la menor área posible: se concentra y aumenta su efecto, como el agua de una manguera, que sale con más fuerza cuanto más chico es el orificio. Por eso muchos golpes usan el canto de mano o los nudillos.\n• No liberar toda la fuerza al comienzo sino en el punto de contacto: cuanto más corto el tiempo de concentración, mayor el poder del impacto.\n• Modo 1: concentrar cada músculo, primero los mayores y más lentos (cadera y abdomen), y usar la herramienta apropiada en el momento adecuado.\n• Modo 2: concentrar esos músculos sobre el punto vital del adversario.\n• Por eso la cadera y el abdomen se mueven ligeramente antes que manos y pies en cualquier ataque o defensa."},{"h":"3. Equilibrio (Kyum Hyung)","t":"El cuerpo debe mantenerse siempre en equilibrio para que los golpes sean eficaces: postura estable y flexible.\n• Estabilidad dinámica y estática: la máxima fuerza solo se produce cuando la estabilidad estática se mantiene a través de la dinámica.\n• Centro de gravedad: sobre la línea entre las dos piernas si el peso se reparte por igual, o sobre el centro del pie si todo el peso va en un solo pie.\n• La flexibilidad y movilidad de la rodilla ayudan al balance en un ataque rápido y su recuperación inmediata.\n• El talón del pie de atrás siempre apoyado en el momento del impacto (equilibrio y máxima potencia)."},{"h":"4. Control de la respiración (Hohup Jojul)","t":"La respiración controlada actúa sobre la resistencia y la velocidad: permite controlar el cuerpo al recibir un golpe e incrementar el poder del propio.\n• Exhalación abrupta al golpear y parar de respirar durante la ejecución: concentra tensión en el abdomen para dar potencia.\n• Inhalación lenta: prepara el próximo movimiento.\n• Nunca inspirar al bloquear o golpear: se pierde potencia.\n• Una sola respiración por movimiento, con excepción del movimiento conectado."},{"h":"5. Velocidad (Sokdo)","t":"Es el factor más importante, más que la fuerza o potencia. Fuerza = masa × aceleración (F = M × A), o bien P = M × V².\n• Energía cinética: un objeto aumenta su peso y velocidad en un movimiento descendente. Por eso, al impactar, la mano suele estar más baja que el hombro, o el pie más bajo que la cadera si el cuerpo está en el aire.\n• Masa (Zilyang): el máximo de fuerza sale de multiplicar el peso del cuerpo por la velocidad máxima. Se aumenta el peso girando las caderas (los abdominales se contraen y la cadera se mueve en el mismo sentido del ataque o bloqueo) y con la flexión de rodillas: subir la cadera al iniciar el movimiento y bajar al impactar.\n• Velocidad y reflejos (Sokdo wa Banung): la duración de los golpes es más corta que la acción refleja normal, así que hay que detectar de antemano la técnica del adversario mirándolo a los ojos y no las piernas o las manos."}],"note":"Fórmulas: F = M × A (fuerza = masa × aceleración) y P = M × V². La velocidad es el factor más importante."}],"cards":[{"i":"poder.1","q":"Teoría del poder: ¿cómo se llama en coreano el factor «Fuerza de reacción»?","a":"Bandong Ryok","p":"pko"},{"i":"poder.2","q":"Teoría del poder: ¿qué factor es «Bandong Ryok»?","a":"Fuerza de reacción","p":"pname"},{"i":"poder.3","q":"Teoría del poder: ¿qué factor describe esto? «Ley de Newton: toda fuerza genera una fuerza igual y en sentido opuesto. Si un auto choca contra una pared con 1000 kg, la pared le devuelve 1000 kg.»","a":"Fuerza de reacción","p":"pname"},{"i":"poder.4","q":"Explica el factor «Fuerza de reacción» (Bandong Ryok).","a":"Ley de Newton: toda fuerza genera una fuerza igual y en sentido opuesto. Si un auto choca contra una pared con 1000 kg, la pared le devuelve 1000 kg.\n• Del oponente: si a quien ataca velozmente se le aplica un suave golpe, la fuerza será la de su ataque más la del golpe aplicado.\n• Propia: un golpe con la mano derecha se ayuda llevando el puño izquierdo hacia atrás."},{"i":"poder.5","q":"Teoría del poder: ¿cómo se llama en coreano el factor «Concentración»?","a":"Jip Joong","p":"pko"},{"i":"poder.6","q":"Teoría del poder: ¿qué factor es «Jip Joong»?","a":"Concentración","p":"pname"},{"i":"poder.7","q":"Teoría del poder: ¿qué factor describe esto? «Aplicar la fuerza de impacto sobre la menor área posible: se concentra y aumenta su efecto, como el agua de una manguera, que sale con más fuerza cuanto más chico es el orificio. Por eso muchos golpes usan el canto de mano o los nudillos.»","a":"Concentración","p":"pname"},{"i":"poder.8","q":"Explica el factor «Concentración» (Jip Joong).","a":"Aplicar la fuerza de impacto sobre la menor área posible: se concentra y aumenta su efecto, como el agua de una manguera, que sale con más fuerza cuanto más chico es el orificio. Por eso muchos golpes usan el canto de mano o los nudillos.\n• No liberar toda la fuerza al comienzo sino en el punto de contacto: cuanto más corto el tiempo de concentración, mayor el poder del impacto.\n• Modo 1: concentrar cada músculo, primero los mayores y más lentos (cadera y abdomen), y usar la herramienta apropiada en el momento adecuado.\n• Modo 2: concentrar esos músculos sobre el punto vital del adversario.\n• Por eso la cadera y el abdomen se mueven ligeramente antes que manos y pies en cualquier ataque o defensa."},{"i":"poder.9","q":"Teoría del poder: ¿cómo se llama en coreano el factor «Equilibrio»?","a":"Kyum Hyung","p":"pko"},{"i":"poder.10","q":"Teoría del poder: ¿qué factor es «Kyum Hyung»?","a":"Equilibrio","p":"pname"},{"i":"poder.11","q":"Teoría del poder: ¿qué factor describe esto? «El cuerpo debe mantenerse siempre en equilibrio para que los golpes sean eficaces: postura estable y flexible.»","a":"Equilibrio","p":"pname"},{"i":"poder.12","q":"Explica el factor «Equilibrio» (Kyum Hyung).","a":"El cuerpo debe mantenerse siempre en equilibrio para que los golpes sean eficaces: postura estable y flexible.\n• Estabilidad dinámica y estática: la máxima fuerza solo se produce cuando la estabilidad estática se mantiene a través de la dinámica.\n• Centro de gravedad: sobre la línea entre las dos piernas si el peso se reparte por igual, o sobre el centro del pie si todo el peso va en un solo pie.\n• La flexibilidad y movilidad de la rodilla ayudan al balance en un ataque rápido y su recuperación inmediata.\n• El talón del pie de atrás siempre apoyado en el momento del impacto (equilibrio y máxima potencia)."},{"i":"poder.13","q":"Teoría del poder: ¿cómo se llama en coreano el factor «Control de la respiración»?","a":"Hohup Jojul","p":"pko"},{"i":"poder.14","q":"Teoría del poder: ¿qué factor es «Hohup Jojul»?","a":"Control de la respiración","p":"pname"},{"i":"poder.15","q":"Teoría del poder: ¿qué factor describe esto? «La respiración controlada actúa sobre la resistencia y la velocidad: permite controlar el cuerpo al recibir un golpe e incrementar el poder del propio.»","a":"Control de la respiración","p":"pname"},{"i":"poder.16","q":"Explica el factor «Control de la respiración» (Hohup Jojul).","a":"La respiración controlada actúa sobre la resistencia y la velocidad: permite controlar el cuerpo al recibir un golpe e incrementar el poder del propio.\n• Exhalación abrupta al golpear y parar de respirar durante la ejecución: concentra tensión en el abdomen para dar potencia.\n• Inhalación lenta: prepara el próximo movimiento.\n• Nunca inspirar al bloquear o golpear: se pierde potencia.\n• Una sola respiración por movimiento, con excepción del movimiento conectado."},{"i":"poder.17","q":"Teoría del poder: ¿cómo se llama en coreano el factor «Velocidad»?","a":"Sokdo","p":"pko"},{"i":"poder.18","q":"Teoría del poder: ¿qué factor es «Sokdo»?","a":"Velocidad","p":"pname"},{"i":"poder.19","q":"Teoría del poder: ¿qué factor describe esto? «Es el factor más importante, más que la fuerza o potencia. Fuerza = masa × aceleración (F = M × A), o bien P = M × V².»","a":"Velocidad","p":"pname"},{"i":"poder.20","q":"Explica el factor «Velocidad» (Sokdo).","a":"Es el factor más importante, más que la fuerza o potencia. Fuerza = masa × aceleración (F = M × A), o bien P = M × V².\n• Energía cinética: un objeto aumenta su peso y velocidad en un movimiento descendente. Por eso, al impactar, la mano suele estar más baja que el hombro, o el pie más bajo que la cadera si el cuerpo está en el aire.\n• Masa (Zilyang): el máximo de fuerza sale de multiplicar el peso del cuerpo por la velocidad máxima. Se aumenta el peso girando las caderas (los abdominales se contraen y la cadera se mueve en el mismo sentido del ataque o bloqueo) y con la flexión de rodillas: subir la cadera al iniciar el movimiento y bajar al impactar.\n• Velocidad y reflejos (Sokdo wa Banung): la duración de los golpes es más corta que la acción refleja normal, así que hay que detectar de antemano la técnica del adversario mirándolo a los ojos y no las piernas o las manos."},{"i":"poder.21","q":"Nombra los 5 factores del poder con su nombre coreano.","a":"Fuerza de reacción (Bandong Ryok) · Concentración (Jip Joong) · Equilibrio (Kyum Hyung) · Control de la respiración (Hohup Jojul) · Velocidad (Sokdo)"},{"i":"poder.22","q":"¿Cuáles son las fórmulas del poder? ¿Cuál es el factor más importante?","a":"F = M × A  y  P = M × V². El factor más importante es la velocidad."}],"readMin":5,"words":604},{"id":"movimientos","name":"Movimientos y formas de realizarlos","sub":"Normal · lento · rápido · continuado · conectado · natural","dan":"II Dan","sections":[{"t":"Tipos de movimiento","items":[{"h":"Normal — 1 técnica · tiempo normal","t":"Ataque o defensa en tiempo y velocidad normal.\nFuerza: la fuerza se aplica en forma real.\nRespiración: respiración normal.\nEjemplo: Chon-Ji, todos sus movimientos."},{"h":"Lento — 1 técnica · tiempo de dos","t":"Una técnica y una exhalación al tiempo de dos.\nFuerza: velocidad lenta; no se aplica la fuerza que debería tener.\nRespiración: lenta y prolongada.\nEjemplo: Primer movimiento de Moon-Moo."},{"h":"Rápido — 2 técnicas · tiempo de uno","t":"Dos movimientos y dos exhalaciones al tiempo de uno.\nFuerza: se incrementa la velocidad entre técnicas, lo que reduce el tiempo entre ellas; fuerza real.\nRespiración: la velocidad de la respiración se incrementa al doble.\nEjemplo: Do-San 15-16 y 19-20 (puños)."},{"h":"Continuado — 2 técnicas · respiración suave","t":"Dos técnicas unidas por una respiración suave.\nFuerza: dos técnicas (ataque, defensa o combinadas) con fuerza real, a menor velocidad que el rápido y mayor que entre dos movimientos normales.\nRespiración: queda suavemente vinculada entre ambas técnicas.\nEjemplo: Dan-Gun 13-14, Toi-Gye 7-8, Ge-Baek 37-38."},{"h":"Conectado — 2 técnicas · 1 respiración","t":"Dos técnicas, una sola respiración.\nFuerza: técnicas encadenadas: el movimiento no termina hasta ejecutar la segunda; fuerza real.\nRespiración: una sola respiración prolongada para las dos, con fuerte exhalación al finalizar la segunda técnica.\nEjemplo: Yul-Gok 16-17 y 19-20 (bloqueo gancho con la palma y puño)."},{"h":"Natural — variante del normal","t":"Como el normal, sin definir el final del movimiento.\nFuerza: igual a la moción normal pero sin llegar a definir el final.\nRespiración: exhalación suave. Se usa generalmente en defensas."}]}],"cards":[{"i":"movimientos.1","q":"Movimiento «Normal»: ¿qué tipo de técnica/tiempo es?","a":"1 técnica · tiempo normal","p":"mtag"},{"i":"movimientos.2","q":"¿Qué tipo de movimiento es este? «Ataque o defensa en tiempo y velocidad normal.»","a":"Normal","p":"mname"},{"i":"movimientos.3","q":"Movimiento «Normal»: ¿cómo es la respiración?","a":"respiración normal."},{"i":"movimientos.4","q":"Movimiento «Normal»: ¿cómo se aplica la fuerza?","a":"la fuerza se aplica en forma real."},{"i":"movimientos.5","q":"Da el ejemplo del manual de movimiento «Normal».","a":"Chon-Ji, todos sus movimientos.","p":"mej"},{"i":"movimientos.6","q":"«Chon-Ji, todos sus movimientos.» ¿qué tipo de movimiento es?","a":"Normal","p":"mname"},{"i":"movimientos.7","q":"Movimiento «Lento»: ¿qué tipo de técnica/tiempo es?","a":"1 técnica · tiempo de dos","p":"mtag"},{"i":"movimientos.8","q":"¿Qué tipo de movimiento es este? «Una técnica y una exhalación al tiempo de dos.»","a":"Lento","p":"mname"},{"i":"movimientos.9","q":"Movimiento «Lento»: ¿cómo es la respiración?","a":"lenta y prolongada."},{"i":"movimientos.10","q":"Movimiento «Lento»: ¿cómo se aplica la fuerza?","a":"velocidad lenta; no se aplica la fuerza que debería tener."},{"i":"movimientos.11","q":"Da el ejemplo del manual de movimiento «Lento».","a":"Primer movimiento de Moon-Moo.","p":"mej"},{"i":"movimientos.12","q":"«Primer movimiento de Moon-Moo.» ¿qué tipo de movimiento es?","a":"Lento","p":"mname"},{"i":"movimientos.13","q":"Movimiento «Rápido»: ¿qué tipo de técnica/tiempo es?","a":"2 técnicas · tiempo de uno","p":"mtag"},{"i":"movimientos.14","q":"¿Qué tipo de movimiento es este? «Dos movimientos y dos exhalaciones al tiempo de uno.»","a":"Rápido","p":"mname"},{"i":"movimientos.15","q":"Movimiento «Rápido»: ¿cómo es la respiración?","a":"la velocidad de la respiración se incrementa al doble."},{"i":"movimientos.16","q":"Movimiento «Rápido»: ¿cómo se aplica la fuerza?","a":"se incrementa la velocidad entre técnicas, lo que reduce el tiempo entre ellas; fuerza real."},{"i":"movimientos.17","q":"Da el ejemplo del manual de movimiento «Rápido».","a":"Do-San 15-16 y 19-20 (puños).","p":"mej"},{"i":"movimientos.18","q":"«Do-San 15-16 y 19-20 (puños).» ¿qué tipo de movimiento es?","a":"Rápido","p":"mname"},{"i":"movimientos.19","q":"Movimiento «Continuado»: ¿qué tipo de técnica/tiempo es?","a":"2 técnicas · respiración suave","p":"mtag"},{"i":"movimientos.20","q":"¿Qué tipo de movimiento es este? «Dos técnicas unidas por una respiración suave.»","a":"Continuado","p":"mname"},{"i":"movimientos.21","q":"Movimiento «Continuado»: ¿cómo es la respiración?","a":"queda suavemente vinculada entre ambas técnicas."},{"i":"movimientos.22","q":"Movimiento «Continuado»: ¿cómo se aplica la fuerza?","a":"dos técnicas (ataque, defensa o combinadas) con fuerza real, a menor velocidad que el rápido y mayor que entre dos movimientos normales."},{"i":"movimientos.23","q":"Da el ejemplo del manual de movimiento «Continuado».","a":"Dan-Gun 13-14, Toi-Gye 7-8, Ge-Baek 37-38.","p":"mej"},{"i":"movimientos.24","q":"«Dan-Gun 13-14, Toi-Gye 7-8, Ge-Baek 37-38.» ¿qué tipo de movimiento es?","a":"Continuado","p":"mname"},{"i":"movimientos.25","q":"Movimiento «Conectado»: ¿qué tipo de técnica/tiempo es?","a":"2 técnicas · 1 respiración","p":"mtag"},{"i":"movimientos.26","q":"¿Qué tipo de movimiento es este? «Dos técnicas, una sola respiración.»","a":"Conectado","p":"mname"},{"i":"movimientos.27","q":"Movimiento «Conectado»: ¿cómo es la respiración?","a":"una sola respiración prolongada para las dos, con fuerte exhalación al finalizar la segunda técnica."},{"i":"movimientos.28","q":"Movimiento «Conectado»: ¿cómo se aplica la fuerza?","a":"técnicas encadenadas: el movimiento no termina hasta ejecutar la segunda; fuerza real."},{"i":"movimientos.29","q":"Da el ejemplo del manual de movimiento «Conectado».","a":"Yul-Gok 16-17 y 19-20 (bloqueo gancho con la palma y puño).","p":"mej"},{"i":"movimientos.30","q":"«Yul-Gok 16-17 y 19-20 (bloqueo gancho con la palma y puño).» ¿qué tipo de movimiento es?","a":"Conectado","p":"mname"},{"i":"movimientos.31","q":"Movimiento «Natural»: ¿qué tipo de técnica/tiempo es?","a":"variante del normal","p":"mtag"},{"i":"movimientos.32","q":"¿Qué tipo de movimiento es este? «Como el normal, sin definir el final del movimiento.»","a":"Natural","p":"mname"},{"i":"movimientos.33","q":"Movimiento «Natural»: ¿cómo es la respiración?","a":"exhalación suave. Se usa generalmente en defensas."},{"i":"movimientos.34","q":"Movimiento «Natural»: ¿cómo se aplica la fuerza?","a":"igual a la moción normal pero sin llegar a definir el final."},{"i":"movimientos.35","q":"Nombra los tipos de movimiento y su definición corta.","a":"Normal: 1 técnica · tiempo normal\nLento: 1 técnica · tiempo de dos\nRápido: 2 técnicas · tiempo de uno\nContinuado: 2 técnicas · respiración suave\nConectado: 2 técnicas · 1 respiración\nNatural: variante del normal"}],"readMin":5,"words":259},{"id":"cultura","name":"Repaso: cultura moral y filosofía","sub":"5 virtudes · humanidad · 8 principios","dan":"III Dan","sections":[{"t":"Cultura moral: las 5 virtudes","items":[{"h":"Humanidad (In)","t":"Experimentar tristeza por las desgracias de los demás y amar a todos por igual, como los padres aman a sus hijos.\n«El cielo provee cuatro estaciones mientras la tierra tiene el poder de producir todas las cosas vivientes. Este privilegio no está reservado para una persona en particular sino para todos los seres humanos.» — Tae Kong Mang"},{"h":"Rectitud (Ui)","t":"Capacidad de experimentar vergüenza por actos injustos y de realizar el deber para con los otros.\n«Para una persona ordinaria, la vida y la muerte son las cosas más importantes en la vida. Sin embargo, para la persona virtuosa, vivir o morir con rectitud es mucho más importante que la vida o la muerte en sí mismas.» — Mencius"},{"h":"Cortesía (Ye)","t":"A diferencia de los animales que luchan para comer, el hombre cortés ofrece a otro un pedazo de pan aunque ambos se mueran de hambre: respeto y decencia.\n«Debe practicar la convivencia para el buen desarrollo de la personalidad, y a quien le falte sinceridad en sus palabras no será considerado un caballero.» — Confucio"},{"h":"Sabiduría (Zi)","t":"Capacidad de diferenciar el bien del mal, no en relación con los otros sino con uno mismo.\n«No importa que tan pequeño sea, no deben hacer lo que saben que es malo. Por otro lado, deben hacer lo que es correcto por pequeño que parezca.» — "},{"h":"Confianza (Shin)","t":"Capacidad de cumplir siempre con las palabras y las promesas. Sin confianza una persona pierde todos los principios y dignidades: se vuelve un mentiroso."}]},{"t":"Los 6 puntos de la Humanidad (In)","items":[{"h":"a)","t":"Amar a la gente, especialmente a los padres."},{"h":"b)","t":"No pedir a los demás que hagan lo que tú no harías."},{"h":"c)","t":"Comportarse automáticamente según la naturaleza, promoviendo el sentido moral."},{"h":"d)","t":"Tener el deseo inquebrantable de realizar lo correcto, sin importar lo insignificante que el resultado parezca frente al esfuerzo requerido."},{"h":"e)","t":"Valorar más el honor de los otros que el propio."},{"h":"f)","t":"Priorizar la libertad de los otros más que la propia."}]},{"t":"Filosofía: los 8 principios","items":[{"h":"1.","t":"Ser gentil con el débil y duro con el fuerte."},{"h":"2.","t":"Estar contento con la posición alcanzada, pero no creer que se ha llegado al límite de desarrollo de su destreza."},{"h":"3.","t":"Terminar siempre lo que se empieza."},{"h":"4.","t":"Ser un profesor a disposición de todos, sin importar religión, raza o ideología del alumno."},{"h":"5.","t":"Nunca ceder a la represión o amenazas cuando se persigue una causa noble."},{"h":"6.","t":"Enseñar con actos y no con palabras."},{"h":"7.","t":"Siempre ser uno mismo, a pesar de que las circunstancias puedan variar."},{"h":"8.","t":"Ser un profesor que enseñe de joven con el cuerpo, con sus palabras cuando es viejo, y con sus preceptos morales después de su muerte."}]}],"cards":[{"i":"cultura.1","q":"Cultura moral: ¿cómo se llama en coreano la virtud «Humanidad»?","a":"In","p":"vko"},{"i":"cultura.2","q":"Cultura moral: ¿qué virtud es «In»?","a":"Humanidad","p":"vname"},{"i":"cultura.3","q":"Cultura moral: ¿qué virtud es esta? «Experimentar tristeza por las desgracias de los demás y amar a todos por igual, como los padres aman a sus hijos.»","a":"Humanidad","p":"vname"},{"i":"cultura.4","q":"¿Quién dijo: «El cielo provee cuatro estaciones mientras la tierra tiene el poder de producir todas las cosas vivientes. Este privilegio no está reservado para una persona en particular sino para todos los seres humanos.»?","a":"Tae Kong Mang","p":"who"},{"i":"cultura.5","q":"Cultura moral: ¿cómo se llama en coreano la virtud «Rectitud»?","a":"Ui","p":"vko"},{"i":"cultura.6","q":"Cultura moral: ¿qué virtud es «Ui»?","a":"Rectitud","p":"vname"},{"i":"cultura.7","q":"Cultura moral: ¿qué virtud es esta? «Capacidad de experimentar vergüenza por actos injustos y de realizar el deber para con los otros.»","a":"Rectitud","p":"vname"},{"i":"cultura.8","q":"¿Quién dijo: «Para una persona ordinaria, la vida y la muerte son las cosas más importantes en la vida. Sin embargo, para la persona virtuosa, vivir o morir con rectitud es mucho más importante que la vida o la muerte en sí mismas.»?","a":"Mencius","p":"who"},{"i":"cultura.9","q":"Cultura moral: ¿cómo se llama en coreano la virtud «Cortesía»?","a":"Ye","p":"vko"},{"i":"cultura.10","q":"Cultura moral: ¿qué virtud es «Ye»?","a":"Cortesía","p":"vname"},{"i":"cultura.11","q":"Cultura moral: ¿qué virtud es esta? «A diferencia de los animales que luchan para comer, el hombre cortés ofrece a otro un pedazo de pan aunque ambos se mueran de hambre: respeto y decencia.»","a":"Cortesía","p":"vname"},{"i":"cultura.12","q":"¿Quién dijo: «Debe practicar la convivencia para el buen desarrollo de la personalidad, y a quien le falte sinceridad en sus palabras no será considerado un caballero.»?","a":"Confucio","p":"who"},{"i":"cultura.13","q":"Cultura moral: ¿cómo se llama en coreano la virtud «Sabiduría»?","a":"Zi","p":"vko"},{"i":"cultura.14","q":"Cultura moral: ¿qué virtud es «Zi»?","a":"Sabiduría","p":"vname"},{"i":"cultura.15","q":"Cultura moral: ¿qué virtud es esta? «Capacidad de diferenciar el bien del mal, no en relación con los otros sino con uno mismo.»","a":"Sabiduría","p":"vname"},{"i":"cultura.16","q":"Cultura moral: ¿cómo se llama en coreano la virtud «Confianza»?","a":"Shin","p":"vko"},{"i":"cultura.17","q":"Cultura moral: ¿qué virtud es «Shin»?","a":"Confianza","p":"vname"},{"i":"cultura.18","q":"Cultura moral: ¿qué virtud es esta? «Capacidad de cumplir siempre con las palabras y las promesas. Sin confianza una persona pierde todos los principios y dignidades: se vuelve un mentiroso.»","a":"Confianza","p":"vname"},{"i":"cultura.19","q":"Nombra las 5 virtudes de la cultura moral con su nombre coreano.","a":"Humanidad (In) · Rectitud (Ui) · Cortesía (Ye) · Sabiduría (Zi) · Confianza (Shin)"},{"i":"cultura.20","q":"Enumera los 6 puntos de la Humanidad.","a":"a) Amar a la gente, especialmente a los padres.\nb) No pedir a los demás que hagan lo que tú no harías.\nc) Comportarse automáticamente según la naturaleza, promoviendo el sentido moral.\nd) Tener el deseo inquebrantable de realizar lo correcto, sin importar lo insignificante que el resultado parezca frente al esfuerzo requerido.\ne) Valorar más el honor de los otros que el propio.\nf) Priorizar la libertad de los otros más que la propia."},{"i":"cultura.21","q":"Filosofía: completa el principio nº 1.","a":"Ser gentil con el débil y duro con el fuerte."},{"i":"cultura.22","q":"Filosofía: completa el principio nº 2.","a":"Estar contento con la posición alcanzada, pero no creer que se ha llegado al límite de desarrollo de su destreza."},{"i":"cultura.23","q":"Filosofía: completa el principio nº 3.","a":"Terminar siempre lo que se empieza."},{"i":"cultura.24","q":"Filosofía: completa el principio nº 4.","a":"Ser un profesor a disposición de todos, sin importar religión, raza o ideología del alumno."},{"i":"cultura.25","q":"Filosofía: completa el principio nº 5.","a":"Nunca ceder a la represión o amenazas cuando se persigue una causa noble."},{"i":"cultura.26","q":"Filosofía: completa el principio nº 6.","a":"Enseñar con actos y no con palabras."},{"i":"cultura.27","q":"Filosofía: completa el principio nº 7.","a":"Siempre ser uno mismo, a pesar de que las circunstancias puedan variar."},{"i":"cultura.28","q":"Filosofía: completa el principio nº 8.","a":"Ser un profesor que enseñe de joven con el cuerpo, con sus palabras cuando es viejo, y con sus preceptos morales después de su muerte."},{"i":"cultura.29","q":"Enumera los 8 principios de la filosofía del Taekwon-Do.","a":"1. Ser gentil con el débil y duro con el fuerte.\n2. Estar contento con la posición alcanzada, pero no creer que se ha llegado al límite de desarrollo de su destreza.\n3. Terminar siempre lo que se empieza.\n4. Ser un profesor a disposición de todos, sin importar religión, raza o ideología del alumno.\n5. Nunca ceder a la represión o amenazas cuando se persigue una causa noble.\n6. Enseñar con actos y no con palabras.\n7. Siempre ser uno mismo, a pesar de que las circunstancias puedan variar.\n8. Ser un profesor que enseñe de joven con el cuerpo, con sus palabras cuando es viejo, y con sus preceptos morales después de su muerte."}],"readMin":5,"words":459},{"id":"ciclo","name":"Ciclo de composición","sub":"Las 5 etapas del ciclo","dan":"III Dan","sections":[{"t":"Ciclo de composición del Taekwon-Do","items":[{"h":"1. Movimientos fundamentales","t":"Cada movimiento básico es un ataque o defensa contra un área particular. Hay que dominar tantos como sea posible para enfrentar cualquier situación de combate real con confianza."},{"h":"2. Formas (tules)","t":"Ponen al estudiante en una situación hipotética: se vale de sí mismo para defenderse o atacar a varios oponentes. Con la práctica se vuelven reflejo condicionado. Cada forma es distinta para desarrollar reacciones ante circunstancias cambiantes."},{"h":"3. Entrenamiento con accesorios","t":"Se desarrolla el cuerpo y se fortalecen las herramientas de ataque y defensa para producir el máximo daño en un combate real."},{"h":"4. Ejercicios de enfrentamientos","t":"Se aplica la habilidad obtenida contra un adversario en movimiento."},{"h":"5. Defensa personal","t":"Se testea la coordinación, velocidad, balance y concentración contra ataques sorpresivos."}],"note":"Es un ciclo: termina en defensa personal y se vuelve a las bases."}],"cards":[{"i":"ciclo.1","q":"Ciclo de composición: ¿qué etapa es la nº 1?","a":"Movimientos fundamentales","p":"ciclo"},{"i":"ciclo.2","q":"Ciclo de composición: ¿en qué consiste «Movimientos fundamentales»?","a":"Cada movimiento básico es un ataque o defensa contra un área particular. Hay que dominar tantos como sea posible para enfrentar cualquier situación de combate real con confianza."},{"i":"ciclo.3","q":"Ciclo de composición: ¿qué etapa describe esto? «Cada movimiento básico es un ataque o defensa contra un área particular. Hay que dominar tantos como sea posible para enfrentar cualquier situación de combate real con confianza.»","a":"Movimientos fundamentales","p":"ciclo"},{"i":"ciclo.4","q":"Ciclo de composición: ¿qué etapa es la nº 2?","a":"Formas (tules)","p":"ciclo"},{"i":"ciclo.5","q":"Ciclo de composición: ¿en qué consiste «Formas (tules)»?","a":"Ponen al estudiante en una situación hipotética: se vale de sí mismo para defenderse o atacar a varios oponentes. Con la práctica se vuelven reflejo condicionado. Cada forma es distinta para desarrollar reacciones ante circunstancias cambiantes."},{"i":"ciclo.6","q":"Ciclo de composición: ¿qué etapa describe esto? «Ponen al estudiante en una situación hipotética: se vale de sí mismo para defenderse o atacar a varios oponentes. Con la práctica se vuelven reflejo condicionado. Cada forma es distinta para desarrollar reacciones ante circunstancias cambiantes.»","a":"Formas (tules)","p":"ciclo"},{"i":"ciclo.7","q":"Ciclo de composición: ¿qué etapa es la nº 3?","a":"Entrenamiento con accesorios","p":"ciclo"},{"i":"ciclo.8","q":"Ciclo de composición: ¿en qué consiste «Entrenamiento con accesorios»?","a":"Se desarrolla el cuerpo y se fortalecen las herramientas de ataque y defensa para producir el máximo daño en un combate real."},{"i":"ciclo.9","q":"Ciclo de composición: ¿qué etapa describe esto? «Se desarrolla el cuerpo y se fortalecen las herramientas de ataque y defensa para producir el máximo daño en un combate real.»","a":"Entrenamiento con accesorios","p":"ciclo"},{"i":"ciclo.10","q":"Ciclo de composición: ¿qué etapa es la nº 4?","a":"Ejercicios de enfrentamientos","p":"ciclo"},{"i":"ciclo.11","q":"Ciclo de composición: ¿en qué consiste «Ejercicios de enfrentamientos»?","a":"Se aplica la habilidad obtenida contra un adversario en movimiento."},{"i":"ciclo.12","q":"Ciclo de composición: ¿qué etapa describe esto? «Se aplica la habilidad obtenida contra un adversario en movimiento.»","a":"Ejercicios de enfrentamientos","p":"ciclo"},{"i":"ciclo.13","q":"Ciclo de composición: ¿qué etapa es la nº 5?","a":"Defensa personal","p":"ciclo"},{"i":"ciclo.14","q":"Ciclo de composición: ¿en qué consiste «Defensa personal»?","a":"Se testea la coordinación, velocidad, balance y concentración contra ataques sorpresivos."},{"i":"ciclo.15","q":"Ciclo de composición: ¿qué etapa describe esto? «Se testea la coordinación, velocidad, balance y concentración contra ataques sorpresivos.»","a":"Defensa personal","p":"ciclo"},{"i":"ciclo.16","q":"Enumera en orden las 5 etapas del ciclo de composición.","a":"1. Movimientos fundamentales\n2. Formas (tules)\n3. Entrenamiento con accesorios\n4. Ejercicios de enfrentamientos\n5. Defensa personal"},{"i":"ciclo.17","q":"¿Cómo termina el ciclo de composición y qué pasa después?","a":"Termina en defensa personal y se vuelve a empezar por los movimientos fundamentales: es un ciclo."}],"readMin":5,"words":142},{"id":"secretos","name":"Secretos del entrenamiento","sub":"Los 9 secretos","dan":"III Dan","sections":[{"t":"Los 9 secretos del entrenamiento","items":[{"h":"1.","t":"Estudiar la teoría del poder a fondo."},{"h":"2.","t":"Entender el propósito y método de cada movimiento claramente."},{"h":"3.","t":"Movilizar los ojos, manos, pies y la respiración en una única acción coordinada."},{"h":"4.","t":"Elegir correctamente el arma de ataque para cada punto vital."},{"h":"5.","t":"Familiarizarse con el ángulo y la distancia correcta de cada ataque y defensa."},{"h":"6.","t":"Mantener brazos y piernas ligeramente flexionadas al realizar los movimientos."},{"h":"7.","t":"Cada movimiento debe empezar con una acción hacia atrás (salvo raras excepciones). Una vez que el movimiento ha empezado, no debe detenerse antes de haber alcanzado el blanco."},{"h":"8.","t":"Crear un movimiento ondulante, utilizando correctamente las rodillas para eso."},{"h":"9.","t":"Exhalar corta y bruscamente en el momento del golpe o la defensa, salvo en movimientos conectados."}]}],"cards":[{"i":"secretos.1","q":"Secreto del entrenamiento nº 1.","a":"Estudiar la teoría del poder a fondo."},{"i":"secretos.2","q":"¿Qué número de secreto es este? «Estudiar la teoría del poder a fondo.»","a":"1","p":"sn"},{"i":"secretos.3","q":"Secreto del entrenamiento nº 2.","a":"Entender el propósito y método de cada movimiento claramente."},{"i":"secretos.4","q":"¿Qué número de secreto es este? «Entender el propósito y método de cada movimiento claramente.»","a":"2","p":"sn"},{"i":"secretos.5","q":"Secreto del entrenamiento nº 3.","a":"Movilizar los ojos, manos, pies y la respiración en una única acción coordinada."},{"i":"secretos.6","q":"¿Qué número de secreto es este? «Movilizar los ojos, manos, pies y la respiración en una única acción coordinada.»","a":"3","p":"sn"},{"i":"secretos.7","q":"Secreto del entrenamiento nº 4.","a":"Elegir correctamente el arma de ataque para cada punto vital."},{"i":"secretos.8","q":"¿Qué número de secreto es este? «Elegir correctamente el arma de ataque para cada punto vital.»","a":"4","p":"sn"},{"i":"secretos.9","q":"Secreto del entrenamiento nº 5.","a":"Familiarizarse con el ángulo y la distancia correcta de cada ataque y defensa."},{"i":"secretos.10","q":"¿Qué número de secreto es este? «Familiarizarse con el ángulo y la distancia correcta de cada ataque y defensa.»","a":"5","p":"sn"},{"i":"secretos.11","q":"Secreto del entrenamiento nº 6.","a":"Mantener brazos y piernas ligeramente flexionadas al realizar los movimientos."},{"i":"secretos.12","q":"¿Qué número de secreto es este? «Mantener brazos y piernas ligeramente flexionadas al realizar los movimientos.»","a":"6","p":"sn"},{"i":"secretos.13","q":"Secreto del entrenamiento nº 7.","a":"Cada movimiento debe empezar con una acción hacia atrás (salvo raras excepciones). Una vez que el movimiento ha empezado, no debe detenerse antes de haber alcanzado el blanco."},{"i":"secretos.14","q":"¿Qué número de secreto es este? «Cada movimiento debe empezar con una acción hacia atrás (salvo raras excepciones). Una vez que el movimiento ha empezado, no debe detenerse antes de haber alcanzado el blanco.»","a":"7","p":"sn"},{"i":"secretos.15","q":"Secreto del entrenamiento nº 8.","a":"Crear un movimiento ondulante, utilizando correctamente las rodillas para eso."},{"i":"secretos.16","q":"¿Qué número de secreto es este? «Crear un movimiento ondulante, utilizando correctamente las rodillas para eso.»","a":"8","p":"sn"},{"i":"secretos.17","q":"Secreto del entrenamiento nº 9.","a":"Exhalar corta y bruscamente en el momento del golpe o la defensa, salvo en movimientos conectados."},{"i":"secretos.18","q":"¿Qué número de secreto es este? «Exhalar corta y bruscamente en el momento del golpe o la defensa, salvo en movimientos conectados.»","a":"9","p":"sn"},{"i":"secretos.19","q":"Enumera los 9 secretos del entrenamiento.","a":"1. Estudiar la teoría del poder a fondo.\n2. Entender el propósito y método de cada movimiento claramente.\n3. Movilizar los ojos, manos, pies y la respiración en una única acción coordinada.\n4. Elegir correctamente el arma de ataque para cada punto vital.\n5. Familiarizarse con el ángulo y la distancia correcta de cada ataque y defensa.\n6. Mantener brazos y piernas ligeramente flexionadas al realizar los movimientos.\n7. Cada movimiento debe empezar con una acción hacia atrás (salvo raras excepciones). Una vez que el movimiento ha empezado, no debe detenerse antes de haber alcanzado el blanco.\n8. Crear un movimiento ondulante, utilizando correctamente las rodillas para eso.\n9. Exhalar corta y bruscamente en el momento del golpe o la defensa, salvo en movimientos conectados."}],"readMin":5,"words":130},{"id":"tules","name":"Tules de 3er Dan","sub":"Sam-Il · Yoo-Sin · Choi-Yong","dan":"III Dan","sections     let ses;

function pick(tids,n,mode){

  due.slice(0,n).forEach(x=>out.push(x));
  const nf=Math.max(0,Math.min(fresh.length,n-out.length));
  fresh.slice(0,nf).forEach(x=>out.push(x));
  rest.slice(0,Math.max(0,n-out.length)).forEach(x=>out.push(x));
  return shuffle(out);
}

function bar(a,b){return `<div class="bar" aria-hidden="true"><i class="a" style="width:${a}%"></i><i class="b" style="width:${b}%"></i></div>`}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function streak(){let n=0,d=todayS();if(!S.log[d])d=addD(d,-1);while(S.log[d]&&S.log[d].n>0){n++;d=addD(d,-1)}return n}
/* ---------- HOY ---------- */
function viewHoy(){
  const t=todayS(),plan=buildPlan(t),e=plan.days.find(x=>x.date===t),all=stats(allIds()),dueN=all.due;
  const L=S.log[t]||{n:0,ok:0};
  let h=`<h2>${esc(fmt(t,{weekday:'long',day:'numeric',month:'long'}))}</h2>`;
  h+=`<div class="row" style="margin-bottom:12px"><div class="card stat"><b>${dueN}</b><span class="small muted">tarjetas para repasar</span></div><div class="card stat"><b>${L.n}</b><span class="small muted">respondidas hoy</span></div><div class="card stat"><b>${streak()}</b><span class="small muted">${streak()===1?'día seguido':'días seguidos'}</span></div></div>`;
  const exd=diff(t,S.prefs.exam);
  if(exd<0)h+=`<div class="card"><h3>El examen ya pasó</h3><p class="muted">Cambiá la fecha en <b>Plan</b> si rendís otra vez.</p></div>`;
  else if(e&&e.kind==='exam')h+=`<div class="card"><h3>¡Hoy es el examen! 🥋</h3><p>Repasá solo lo liviano: cruces y puntos que más te cuestan. Confiá en lo que estudiaste.</p><button class="btn pri" data-act="startTopics" data-t="cruces">Repasar cruces</button></div>`;
  else if(e&&e.kind==='study'){
    h+=`<div class="card"><div class="row sb"><h3 style="margin:0">Plan de hoy</h3><span class="tag">${S.prefs.mins} min</span></div>`;
    if(!e.items.length)h+=`<p class="muted">Sin temas asignados. Revisá las prioridades en Plan.</p>`;
    e.items.forEach(it=>{const tp=BY[it.id];const first=it.k===1;
      h+=`<div class="item"><b>${esc(tp.name)}</b><div class="small muted">${first?'Leé la teoría y practicá':'Practicá y repasá'} · sesión ${it.k} de ${it.of}${readTag(it.id)}</div><div class="row" style="margin-top:8px">${first?`<button class="btn sm" data-act="openTopic" data-t="${it.id}">Leer teoría</button>`:''}<button class="btn sm pri" data-act="startTopics" data-t="${it.id}">Practicar</button></div></div>`});
    h+=`</div>`;
  }else if(e&&e.kind==='review'){
    const txt=e.step==='sim'?'Simulacro completo: preguntas de todos los temas mezcladas.':e.step==='last'?'Repaso liviano: cruces entre temas y tus puntos más flojos.':'Repaso general de todos los temas (primero lo que toca repetir).';
    h+=`<div class="card"><div class="row sb"><h3 style="margin:0">Repaso final</h3><span class="tag warn">${S.prefs.mins} min</span></div><p>${txt}</p><div class="row">${e.step==='sim'?`<button class="btn pri" data-act="sim">Hacer simulacro</button>`:`<button class="btn pri" data-act="startTopics" data-t="${e.step==='last'?'cruces':plan.active.join(',')}">Practicar</button>`}</div></div>`;
  }else h+=`<div class="card"><h3>Hoy es día libre</h3><p class="muted">No hay estudio planificado. Si querés, hacé un repaso corto de lo pendiente.</p></div>`;
  h+=`<div class="card"><h3>Repaso inteligente</h3><p class="small muted">Las tarjetas que respondés bien vuelven cada vez más espaciadas; las que fallás vuelven antes.</p><div class="row"><button class="btn ${dueN?'pri':''}" data-act="startAll">${dueN?`Repasar ${Math.min(S.prefs.n,dueN)} pendientes`:'Practicar 10 al azar'}</button><button class="btn" data-act="sim">Simulacro</button></div></div>`;
  const weak=weakTopics().slice(0,2);
  if(weak.length&&all.seen>20)h+=`<div class="card"><h3>Para reforzar</h3>${weak.map(w=>`<div class="row sb item"><span>${esc(BY[w.id].name)} <span class="tag bad">${w.acc}% de aciertos</span></span><button class="btn sm" data-act="startTopics" data-t="${w.id}">Practicar</button></div>`).join('')}</div>`;
  if(saveFail)h+=`<div class="warnbox">Este navegador no permite guardar el progreso. Usá «Exportar» en Progreso para llevártelo.</div>`;
  return h;
}
const readTag=id=>S.read[id]?' · <span class="tag ok">teoría leída</span>':'';
function weakTopics(){return TOP.map(t=>{const s=stats(t.cards.map(c=>c.i));const tot=s.ok+s.ko;return{id:t.id,acc:tot>=5?Math.round(s.ok/tot*100):null}}).filter(x=>x.acc!==null&&x.acc<75).sort((a,b)=>a.acc-b.acc)}

  <label class="f" for="pstyle">Cómo ordenar los temas</label><select id="pstyle" data-pref="style"><option value="mix" ${P.style==='mix'?'selected':''}>Intercalado: mezclo temas para que no se te olviden</option><option value="block" ${P.style==='block'?'selected':''}>Por bloques: un tema completo y después el siguiente</option></select>
  <label class="f" for="pfin">Días de repaso final (con simulacro)</label><select id="pfin" data-pref="finalDays">${[0,2,3,4,5,6,7].map(m=>`<option value="${m}" ${P.finalDays===m?'selected':''}>${m===0?'Sin repaso final':m+' días antes del examen'}</option>`).join('')}</select>

  P.order.forEach((id,i)=>{const tp=BY[id];h+=`<div class="item"><div class="row sb"><b style="display:inline">${esc(tp.name)}</b><span class="row" style="gap:6px"><button class="btn sm" style="min-height:40px;padding:0 12px" data-act="mv" data-i="${i}" data-d="-1" aria-label="Subir ${esc(tp.name)}" ${i===0?'disabled':''}>↑</button><button class="btn sm" style="min-height:40px;padding:0 12px" data-act="mv" data-i="${i}" data-d="1" aria-label="Bajar ${esc(tp.name)}" ${i===P.order.length-1?'disabled':''}>↓</button></span></div>
  <select data-prio="${id}" aria-label="Prioridad de ${esc(tp.name)}" style="margin-top:6px">${[['high','Prioridad alta'],['normal','Prioridad normal'],['low','Prioridad baja'],['skip','Ya lo domino (no incluir)']].map(([v,l])=>`<option value="${v}" ${prioOf(id)===v?'selected':''}>${l}</option>`).join('')}</select></div>`});
  h+=`</div>`;
  const ratio=plan.have?plan.need/plan.have:9;
  if(diff(t,P.exam)<0)h+=`<div class="warnbox">La fecha del examen ya pasó. Cambiala arriba.</div>`;
  else{
    h+=ratio>1.15?`<div class="warnbox"><b>Ritmo ajustado:</b> necesitás ~${Math.round(plan.need)} min y tenés ~${Math.round(plan.have)} min. Sumá días o minutos, o marcá como dominados los temas que ya sabés.</div>`:`<div class="card" style="background:var(--okbg);color:var(--ok);border-color:transparent"><b>Ritmo cómodo:</b> ~${Math.round(plan.need)} min de trabajo estimado y ${Math.round(plan.have)} min disponibles hasta el examen.</div>`;
  }
  h+=`<h2>Calendario</h2>`;
  if(!plan.days.length)h+=`<p class="muted">No hay días de estudio entre hoy y el examen con estas preferencias.</p>`;
  let wk='';
  plan.days.forEach(x=>{
    const d=parse(x.date),mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));const k=ymd(mon);
    if(k!==wk){wk=k;h+=`<div class="wk">Semana del ${esc(fmt(k,{day:'numeric',month:'short'}))}</div>`}
    let body,ids='';
    if(x.kind==='exam')body='<b>Examen 4º Dan</b>';
    else if(x.kind==='review'){body=`<b>${x.step==='sim'?'Simulacro completo':x.step==='last'?'Repaso liviano: cruces y puntos flojos':'Repaso general'}</b>`;ids=x.step==='last'?'cruces':plan.active.join(',')}
    else{body=x.items.length?x.items.map(it=>`<b>${esc(BY[it.id].name)}</b><span class="small muted">${it.k===1?'Teoría + práctica':'Práctica'}${it.of>1?` (${it.k}/${it.of})`:''}</span>`).join('<br>'):'<span class="muted">Libre</span>';ids=x.items.map(i=>i.id).join(',')}
    const isT=x.date===t;

function startSession(ids,mode){
  if(!ids.length){sess=null;return}
  sess={q:ids.slice(),i:0,res:[],mode:mode||'norm',retry:new Set(),ans:false,opts:null,pickd:null,done:false};setOpts();tab='practicar';
}
function setOpts(){const c=CARD[sess.q[sess.i]];sess.opts=c?mkOpts(c):null;sess.ans=false;sess.pickd=null}
function viewSession(){
  const s=sess;
  if(s.done)return viewSummary();
  const c=CARD[s.q[s.i]],tp=BY[c.t],tot=s.q.length;
  let h=`<div class="row sb" style="margin-top:16px"><button class="btn sm" data-act="quit">← Salir</button><span class="small muted">${s.i+1} / ${tot}</span></div><div style="margin:10px 0 14px">${bar(0,Math.round(s.i/tot*100))}</div>`;
  h+=`<div class="card"><span class="tag">${esc(tp.name)}</span><div class="q pre">${esc(c.q)}</div>`;
  if(s.opts){
    h+=s.opts.map((o,k)=>{let cl='';if(s.ans){if(o===c.a)cl='right';else if(o===s.pickd)cl='wrong'}return `<button class="opt ${cl}" data-act="opt" data-k="${k}" ${s.ans?'disabled':''}>${esc(o)}</button>`}).join('');
    if(s.ans)h+=`<p class="${s.pickd===c.a?'':'small'}" style="margin:6px 0 12px"><span class="tag ${s.pickd===c.a?'ok':'bad'}">${s.pickd===c.a?'¡Correcto!':'Era: '+esc(c.a.length>60?'la opción marcada en verde':c.a)}</span></p><button class="btn pri" data-act="next">${s.i+1<s.q.length?'Siguiente':'Ver resultado'}</button>`;
  }else{
    if(!s.ans)h+=`<button class="btn pri" data-act="show">Mostrar respuesta</button>`;
    else h+=`<div class="ans pre">${esc(c.a)}</div><p class="small muted" style="margin-bottom:8px">¿Qué tal te fue?</p><div class="rate"><button class="btn" data-act="rate" data-g="0">No la sabía</button><button class="btn" data-act="rate" data-g="1">Dudé</button><button class="btn pri" data-act="rate" data-g="2">La sabía</button></div>`;
  }
  return h+'</div>';
}
function grade(id,g,first){
  const t=todayS();let c=S.cards[id]||(S.cards[id]={b:0,due:t,ok:0,ko:0});
  if(first){if(g===2){c.b=Math.min(5,c.b+1);c.ok++}else if(g===1){c.b=Math.max(1,c.b);c.ok++}else{c.b=1;c.ko++}c.due=addD(t,g===0?0:INT[c.b]||1);if(g===0)c.due=addD(t,1)}
  if(first){const L=S.log[t]||(S.log[t]={n:0,ok:0});L.n++;if(g>=1)L.ok++}
  save();
}
function advance(g){
  const s=sess,id=s.q[s.i],first=!s.retry.has(id);
  grade(id,g,first);
  if(first)s.res.push({id,g});
  if(g===0&&first&&s.mode!=='sim'){s.retry.add(id);s.q.push(id)}
  if(s.i+1<s.q.length){s.i++;setOpts()}else{s.done=true;if(s.mode==='sim'){const sc=s.res.filter(r=>r.g===2).length;S.sims.push({d:todayS(),sc,tot:s.res.length});save()}}
  render();window.scrollTo({top:0});
}
function viewSummary(){
  const s=sess,ok=s.res.filter(r=>r.g===2).length,tot=s.res.length,bad=s.res.filter(r=>r.g<2);
  let h=`<h2>${s.mode==='sim'?'Resultado del simulacro':'Sesión terminada'}</h2><div class="card"><div class="row"><div class="stat"><b>${ok}/${tot}</b><span class="muted small">respuestas seguras</span></div><div class="stat"><b>${pct(ok,tot)}%</b><span class="muted small">acierto</span></div></div></div>`;
  if(bad.length){h+=`<div class="card"><h3>Para repasar (${bad.length})</h3>`;bad.forEach(r=>{const c=CARD[r.id];h+=`<div class="item"><span class="tag">${esc(BY[c.t].name)}</span><b class="pre" style="margin-top:4px">${esc(c.q)}</b><div class="pre small muted" style="margin-top:4px">${esc(c.a)}</div></div>`});h+=`</div><div class="row"><button class="btn pri" data-act="again">Repetir las falladas</button><button class="btn" data-act="quit">Terminar</button></div>`}
  else h+=`<p>¡Excelente! Ninguna para repasar.</p><button class="btn pri" data-act="quit">Terminar</button>`;
  return h;
}

function viewTheory(){

    let h=`<div style="margin-top:16px"><button class="btn sm" data-act="closeTopic">← Todos los temas</button></div><h2>${esc(t.name)}</h2><p class="muted">${esc(t.sub)} · ${esc(t.dan)} · lectura ≈ ${t.readMin} min</p>`;

    t.sections.forEach(s=>{h+=`<details class="sec" ${one?'open':''}><summary>${esc(s.t)}</summary><div class="body">${s.note?`<p class="small muted pre">${esc(s.note)}</p>`:''}${s.items.map(i=>`<div class="item">${i.h?`<b>${esc(i.h)}</b>`:''}${i.t?`<div class="pre">${esc(i.t)}</div>`:''}</div>`).join('')}</div></details>`});
    return h;

function theoryList(){
  const q=query.trim().toLowerCase();
  if(q.length>=2){
    const hits=[];
    TOP.forEach(t=>t.sections.forEach(s=>s.items.forEach(i=>{const hay=((i.h||'')+' '+(i.t||'')+' '+s.t).toLowerCase();if(hay.includes(q))hits.push({t,s,i})})));
    if(!hits.length)return `<p class="muted">Sin resultados.</p>`;
    const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    const hl=x=>esc(x).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
    return `<p class="small muted">${hits.length} resultado${hits.length>1?'s':''}${hits.length>40?' (mostrando 40)':''}</p>`+hits.slice(0,40).map(({t,s,i})=>`<div class="card"><button class="tag" style="border:0;cursor:pointer" data-act="openTopic" data-t="${t.id}">${esc(t.name)}</button> <span class="small muted">${esc(s.t)}</span>${i.h?`<b style="display:block;margin-top:4px">${hl(i.h)}</b>`:''}<div class="pre">${hl(i.t||'')}</div></div>`).join('');
  }
  return TOP.map(t=>{const s=stats(t.cards.map(c=>c.i));return `<button class="day" data-act="openTopic" data-t="${t.id}" style="display:block"><div class="row sb"><b>${esc(t.name)}</b><span class="tag">${esc(t.dan)}</span></div><div class="small muted">${esc(t.sub)}</div><div class="small" style="margin-top:6px">${t.sections.length} secciones · ${t.readMin} min${S.read[t.id]?' · <span class="tag ok">leída</span>':''}</div></button>`}).join('');
}

  h+=`</div>`;
  if(S.sims.length)h+=`<div class="card"><h3>Simulacros</h3>${S.sims.slice(-6).reverse().map(x=>`<div class="row sb item"><span>${esc(fmt(x.d))}</span><span class="tag ${pct(x.sc,x.tot)>=80?'ok':pct(x.sc,x.tot)>=60?'warn':'bad'}">${x.sc}/${x.tot} · ${pct(x.sc,x.tot)}%</span></div>`).join('')}</div>`;
  h+=`<div class="card"><h3>Sincronización</h3><p class="small" role="status">${syncState==='ok'?'<span class="tag ok">Activa</span> Tu progreso se guarda en la nube y aparece en todos tus dispositivos.'+(fbUser?'<br>Cuenta: '+esc(fbUser.email||''):''):syncState==='err'?'<span class="tag bad">Error</span> No pude sincronizar ahora; se guarda en este dispositivo y reintenta en el próximo cambio.':syncState==='signin'?'<span class="tag warn">Falta iniciar sesión</span> Entrá con Google para sincronizar entre dispositivos.':'<span class="tag warn">Solo este dispositivo</span> La sincronización no está configurada. Podés usar la copia de seguridad de abajo.'}</p>${syncState==='signin'?'<button class="btn pri sm" data-act="fbin">Iniciar sesión con Google</button>':''}${fbUser?'<button class="btn sm" data-act="fbout">Cerrar sesión</button>':''}</div><div class="card"><h3>Copia de seguridad</h3><p class="small muted">Alternativa manual. Para pasarlo a otro dispositivo, copiá este texto y pegalo allá.</p><textarea id="bk" aria-label="Datos de progreso" readonly>${esc(JSON.stringify({p:S.prefs,c:S.cards,r:S.read,l:S.log,s:S.sims}))}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" data-act="copy">Copiar</button><button class="btn sm" data-act="imp">Cargar texto pegado</button></div><p class="small" id="bkmsg" role="status"></p>
  <div class="row" style="margin-top:6px">${confirmReset?`<button class="btn sm" style="border-color:var(--bad);color:var(--bad)" data-act="reset2">Sí, borrar todo mi progreso</button><button class="btn sm" data-act="reset0">Cancelar</button>`:`<button class="btn sm" data-act="reset1">Borrar progreso</button>`}</div></div>`;
  return h;
}
/* ---------- render ---------- */
function render(){
  renderTabs();renderCount();
  const m=$('#main');
  m.innerHTML=tab==='hoy'?viewHoy():tab==='plan'?viewPlan():tab==='practicar'?viewPractice():tab==='teoria'?viewTheory():viewProgress();
}
/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='tab'){tab=b.dataset.k;if(tab!=='teoria')topicOpen=null;render();window.scrollTo({top:0});return}
  if(a==='openTopic'){tab='teoria';topicOpen=b.dataset.t;render();window.scrollTo({top:0});return}
  if(a==='closeTopic'){topicOpen=null;render();return}
  if(a==='toggleRead'){const id=b.dataset.t;S.read[id]=!S.read[id];save();render();return}
  if(a==='day'){const i=+b.dataset.i;S.prefs.days[i]=S.prefs.days[i]?0:1;if(!S.prefs.days.some(Boolean))S.prefs.days[i]=1;save();render();return}
  if(a==='mv'){const i=+b.dataset.i,d=+b.dataset.d,o=S.prefs.order,j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];save();render();return}
  if(a==='selt'){const id=b.dataset.t;sel.has(id)?sel.delete(id):sel.add(id);render();return}
  if(a==='selall'){sel=new Set(TOP.map(t=>t.id));render();return}
  if(a==='selnone'){sel=new Set();render();return}
  if(a==='startSel'){const mode=($('#pmode')||{}).value||'smart';startSession(pick([...sel],S.prefs.n,mode));render();window.scrollTo({top:0});return}
  if(a==='startTopics'){const ids=b.dataset.t.split(',');startSession(pick(ids,S.prefs.n,'smart'));render();window.scrollTo({top:0});return}
  if(a==='startAll'){const t=todayS(),has=stats(allIds()).due>0;startSession(pick(null,S.prefs.n,has?'smart':'random'));render();window.scrollTo({top:0});return}
  if(a==='sim'){startSession(simPick(),'sim');render();window.scrollTo({top:0});return}
  if(a==='quit'){sess=null;render();return}
  if(a==='again'){const bad=sess.res.filter(r=>r.g<2).map(r=>r.id);startSession(shuffle(bad));render();window.scrollTo({top:0});return}
  if(a==='opt'){const s=sess;if(s.ans)return;const c=CARD[s.q[s.i]];s.pickd=s.opts[+b.dataset.k];s.ans=true;s.g=s.pickd===c.a?2:0;render();return}
  if(a==='next'){advance(sess.g);return}
  if(a==='show'){sess.ans=true;render();return}
  if(a==='rate'){advance(+b.dataset.g);return}
  if(a==='copy'){const ta=$('#bk');ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}try{navigator.clipboard&&navigator.clipboard.writeText(ta.value);ok=true}catch(_){}$('#bkmsg').textContent=ok?'Copiado.':'Seleccioná el texto y copialo manualmente.';return}
  if(a==='imp'){const ta=$('#bk');ta.removeAttribute('readonly');ta.value='';ta.placeholder='Pegá acá el texto y tocá de nuevo «Cargar texto pegado»';ta.focus();b.dataset.act='imp2';b.textContent='Aplicar';return}
  if(a==='imp2'){try{const o=JSON.parse($('#bk').value);S.prefs=Object.assign(defPrefs(),o.p||{});S.cards=o.c||{};S.read=o.r||{};S.log=o.l||{};S.sims=o.s||[];save();render();$('#bkmsg').textContent='Progreso cargado.'}catch(_){$('#bkmsg').textContent='El texto no es válido.'}return}
  if(a==='fbin'){fbProv&&fbProv.signIn().catch(()=>{syncState='err';render()});return}
  if(a==='fbout'){fbProv&&fbProv.signOut();return}
  if(a==='reset1'){confirmReset=true;render();return}
  if(a==='reset0'){confirmReset=false;render();return}
  if(a==='reset2'){S={prefs:defPrefs(),cards:{},read:{},log:{},sims:[]};save();confirmReset=false;render();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pref){const k=t.dataset.pref;let v=t.value;
    if(k==='mins'||k==='finalDays'||k==='n')v=+v;if(k==='mc')v=v==='1';
    if(k==='exam'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))return;
    S.prefs[k]=v;save();if(k!=='n')render();return}
  if(t.dataset.prio){S.prefs.prio[t.dataset.prio]=t.value;save();render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;const r=$('#tres');if(r)r.innerHTML=theoryList()}});
render();
async function startSync(r){
  if(remoteUnsub){try{remoteUnsub()}catch(e){}remoteUnsub=null}
  try{
    const d=await r.get();
    if(d&&(d.ts||0)>(S.ts||0)&&d.json){try{applyRemote(JSON.parse(d.json))}catch(e){}}
    remote=r;syncState='ok';
    if(!d||(S.ts||0)>(d.ts||0)){await r.set({json:JSON.stringify(S),ts:S.ts||Date.now()})}
    remoteUnsub=r.sub(d=>{if(d&&d.json&&(d.ts||0)>(S.ts||0)&&!sess){try{applyRemote(JSON.parse(d.json));render()}catch(e){}}});
  }catch(e){syncState='err'}
  render();
}
async function claudeProvider(){
  const claude=window.claude;if(!claude||!claude.use)return null;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return null;const uid=await user.id();if(!uid)return null;
  const ref=db.doc('data/users/'+uid+'/progress');
  return{get:async()=>{const s=await ref.get();return s.exists?s.data():null},set:d=>ref.set(d),sub:cb=>ref.onSnapshot(s=>{if(s.exists)cb(s.data())},()=>{})};
}
async function firebaseProvider(cfg){
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(cfg),auth=Au.getAuth(app),fs=F.getFirestore(app);
  return{signIn:()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider()),signOut:()=>Au.signOut(auth),onUser:cb=>Au.onAuthStateChanged(auth,cb),
    bind:u=>{const ref=F.doc(fs,'users',u.uid,'data','progress');return{get:async()=>{const s=await F.getDoc(ref);return s.exists()?s.data():null},set:d=>F.setDoc(ref,d),sub:cb=>F.onSnapshot(ref,s=>{if(s.exists())cb(s.data())},()=>{})}}};
}
(async function initSync(){
  try{
    const cp=await claudeProvider();
    if(cp){await startSync(cp);return}
    const cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey&&!/PEGAR/.test(cfg.apiKey)){
      syncState='signin';render();
      fbProv=await firebaseProvider(cfg);
      fbProv.onUser(async u=>{fbUser=u;if(u){await startSync(fbProv.bind(u))}else{if(remoteUnsub){try{remoteUnsub()}catch(e){}remoteUnsub=null}remote=null;syncState='signin';render()}});
    }
  }catch(e){syncState='err';render()}
})();
})();
</script>
